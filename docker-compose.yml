version: "3.8"

services:

  db:
    image: postgres:16-alpine
    container_name: schoolmaster_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: school_master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d school_master"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: schoolmaster_redis
    command: redis-server --requirepass redispass --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: school_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: schoolmaster_app
    entrypoint: ["python", "/app/entrypoint.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
    ports:
      - "8000:8000"

  worker_attendance:
    build: .
    container_name: worker_attendance
    command: celery -A app.core.celery worker -Q attendance --loglevel=info --concurrency=2
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq

  worker_grades:
    build: .
    container_name: worker_grades
    command: celery -A app.core.celery worker -Q grades --loglevel=info --concurrency=2
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq

  worker_notificacoes:
    build: .
    container_name: worker_notificacoes
    command: celery -A app.core.celery worker -Q notificacoes --loglevel=info --concurrency=4
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq

  flower:
    build: .
    container_name: schoolmaster_flower
    command: celery -A app.core.celery flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq

volumes:
  postgres_data:
  redis_data: